name: Keep Render awake

on:
  schedule:
    # Toutes les 13 minutes (< 15 min d'inactivité Render)
    - cron: "*/13 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping application
        run: |
          URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$URL" ]; then
            echo "Erreur: définissez le secret RENDER_APP_URL dans GitHub"
            exit 1
          fi
          echo "Ping → $URL"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 -L "$URL")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
            exit 0
          fi
          exit 1
